<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Lib - Sala Múltipla</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; text-align: center; }
        .videos { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 20px; }
        .video-container { display: flex; flex-direction: column; align-items: center; }
        video { background: #000; border-radius: 8px; max-width: 300px; width: 100%; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #0066cc; color: white; border: none; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Teste - Sala Múltipla</h1>
    <button id="startBtn">Entrar na Sala</button>
    <div class="videos" id="videoGrid">
        <div class="video-container" id="localContainer" style="display: none;">
            <h3>Você (Local)</h3>
            <video id="localVideo" autoplay playsinline muted></video>
        </div>
    </div>

    <script type="module">
        import { Video } from '/client/index.js';

        const startBtn = document.getElementById('startBtn');
        const localVideo = document.getElementById('localVideo');
        const localContainer = document.getElementById('localContainer');
        const videoGrid = document.getElementById('videoGrid');

        startBtn.addEventListener('click', async () => {
            startBtn.disabled = true;
            
            // Cria a abstração da sala
            const sala = await Video.sala('sala-reuniao');

            // Quando alguém entrar
            sala.on('entrar', (usuario) => {
                console.log('Usuário entrou:', usuario.id);
            });

            // Quando alguém sair, removemos o vídeo dele
            sala.on('sair', (usuario) => {
                console.log('Usuário saiu:', usuario.id);
                const container = document.getElementById(`container-${usuario.id}`);
                if (container) {
                    container.remove();
                }
            });

            // Quando receber vídeo de alguém, adiciona na tela
            sala.on('video', ({ usuario, stream }) => {
                let container = document.getElementById(`container-${usuario.id}`);
                
                if (!container) {
                    container = document.createElement('div');
                    container.className = 'video-container';
                    container.id = `container-${usuario.id}`;
                    
                    const label = document.createElement('h3');
                    label.innerText = `Usuário: ${usuario.id.substring(0, 5)}`;
                    
                    const videoEl = document.createElement('video');
                    videoEl.id = `video-${usuario.id}`;
                    videoEl.autoplay = true;
                    videoEl.playsInline = true;
                    videoEl.srcObject = stream;

                    container.appendChild(label);
                    container.appendChild(videoEl);
                    videoGrid.appendChild(container);
                } else {
                    // Atualiza o stream caso o container já exista e receba um novo track
                    const videoEl = document.getElementById(`video-${usuario.id}`);
                    if (videoEl && videoEl.srcObject !== stream) {
                        videoEl.srcObject = stream;
                    }
                }
            });

            // 1. Pede câmera e exibe
            localContainer.style.display = 'flex';
            await sala.camera(localVideo);
            await sala.microfone();

            // 2. Entra na sala (Mesh P2P inicia as conexões)
            await sala.entrar();
        });
    </script>
</body>
</html>
