<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Lib - Player de Vídeos</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: sans-serif; background: #111; color: #eee; 
            padding: 30px; min-height: 100vh;
        }
        h1 { text-align: center; margin-bottom: 24px; }

        .layout { display: flex; gap: 24px; max-width: 1100px; margin: 0 auto; }

        /* Lista de vídeos */
        .video-list { 
            width: 320px; flex-shrink: 0;
            background: #1a1a1a; border-radius: 10px; padding: 16px;
            max-height: 80vh; overflow-y: auto;
        }
        .video-list h2 { font-size: 16px; margin-bottom: 12px; color: #aaa; }
        .video-item { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 12px; border-radius: 8px; margin-bottom: 8px;
            background: #222; cursor: pointer; transition: background 0.2s;
        }
        .video-item:hover { background: #333; }
        .video-item.active { background: #0055aa; }
        .video-info { flex: 1; min-width: 0; }
        .video-name { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .video-size { font-size: 11px; color: #888; margin-top: 2px; }
        .download-btn { 
            background: none; border: none; color: #4da6ff; font-size: 18px; 
            cursor: pointer; padding: 4px 8px; flex-shrink: 0;
        }
        .download-btn:hover { color: #80c0ff; }

        /* Player */
        .player-area { flex: 1; min-width: 0; }
        video { 
            width: 100%; border-radius: 10px; background: #000; 
            max-height: 70vh;
        }
        .player-status { 
            text-align: center; margin-top: 10px; font-size: 13px; color: #666; 
        }
        .empty-state {
            display: flex; align-items: center; justify-content: center;
            height: 300px; background: #1a1a1a; border-radius: 10px;
            color: #555; font-size: 15px;
        }

        /* Upload */
        .upload-area {
            display: flex; gap: 10px; margin-bottom: 12px;
        }
        .upload-btn {
            width: 100%; padding: 10px; font-size: 14px; cursor: pointer;
            background: #2a6e2a; color: white; border: none; border-radius: 6px;
            transition: background 0.2s;
        }
        .upload-btn:hover { background: #3a8e3a; }
        .upload-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .upload-progress {
            font-size: 12px; color: #aaa; margin-top: 4px; text-align: center;
        }
    </style>
</head>
<body>
    <h1>🎬 Player de Vídeos</h1>

    <div class="layout">
        <div class="video-list" id="videoList">
            <h2>📁 Vídeos Disponíveis</h2>
            <div class="upload-area">
                <button class="upload-btn" id="uploadBtn">📤 Enviar Vídeo</button>
                <input type="file" id="fileInput" accept="video/*" style="display:none;" />
            </div>
            <p class="upload-progress" id="uploadStatus"></p>
            <div id="listContent"><p style="color:#555; font-size:13px;">Carregando...</p></div>
        </div>

        <div class="player-area">
            <div class="empty-state" id="emptyState">Selecione um vídeo na lista ao lado</div>
            <video id="player" controls style="display:none;"></video>
            <p class="player-status" id="playerStatus"></p>
        </div>
    </div>

    <script type="module">
        import { Video } from '/client/index.js';

        const SERVER = 'http://localhost:3000';
        Video.configure({ serverUrl: SERVER });

        const listContent = document.getElementById('listContent');
        const player = document.getElementById('player');
        const emptyState = document.getElementById('emptyState');
        const playerStatus = document.getElementById('playerStatus');
        const uploadBtn = document.getElementById('uploadBtn');
        const fileInput = document.getElementById('fileInput');
        const uploadStatus = document.getElementById('uploadStatus');

        let activeItem = null;

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            if (bytes < 1073741824) return (bytes / 1048576).toFixed(1) + ' MB';
            return (bytes / 1073741824).toFixed(2) + ' GB';
        }

        // ========== UPLOAD ==========
        uploadBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', async () => {
            const arquivo = fileInput.files[0];
            if (!arquivo) return;

            uploadBtn.disabled = true;
            uploadStatus.textContent = `Enviando "${arquivo.name}" (${formatSize(arquivo.size)})...`;

            try {
                const resultado = await Video.enviar(arquivo);
                uploadStatus.textContent = `✅ "${resultado.nome}" enviado com sucesso!`;
                fileInput.value = ''; // Reset input
                await loadList(); // Recarrega a lista
            } catch (err) {
                uploadStatus.textContent = `❌ Erro: ${err.message}`;
            } finally {
                uploadBtn.disabled = false;
            }
        });

        // ========== LISTAGEM E PLAYER ==========
        async function loadList() {
            try {
                const videos = await Video.listar();
                
                if (videos.length === 0) {
                    listContent.innerHTML = '<p style="color:#888; font-size:13px;">Nenhum vídeo encontrado.<br><br>Use o botão acima para enviar um vídeo, ou coloque arquivos <b>.mp4</b>, <b>.webm</b> etc. na pasta <code>example/videos/</code> e recarregue a página.</p>';
                    return;
                }

                listContent.innerHTML = '';
                
                for (const video of videos) {
                    const item = document.createElement('div');
                    item.className = 'video-item';
                    
                    const info = document.createElement('div');
                    info.className = 'video-info';
                    
                    const name = document.createElement('div');
                    name.className = 'video-name';
                    name.textContent = video.nome;
                    
                    const size = document.createElement('div');
                    size.className = 'video-size';
                    size.textContent = formatSize(video.tamanho);
                    
                    info.appendChild(name);
                    info.appendChild(size);

                    const dlBtn = document.createElement('button');
                    dlBtn.className = 'download-btn';
                    dlBtn.textContent = '⬇';
                    dlBtn.title = 'Baixar vídeo';
                    dlBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        Video.baixar(SERVER + video.url, video.nome);
                    });

                    item.appendChild(info);
                    item.appendChild(dlBtn);

                    item.addEventListener('click', () => {
                        if (activeItem) activeItem.classList.remove('active');
                        item.classList.add('active');
                        activeItem = item;

                        emptyState.style.display = 'none';
                        player.style.display = 'block';
                        Video.reproduzir(SERVER + video.url, player);
                        playerStatus.textContent = `Reproduzindo: ${video.nome} (${formatSize(video.tamanho)})`;
                    });

                    listContent.appendChild(item);
                }
            } catch (err) {
                listContent.innerHTML = `<p style="color:#cc3333; font-size:13px;">Erro ao carregar: ${err.message}</p>`;
            }
        }

        loadList();
    </script>
</body>
</html>
